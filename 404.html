<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | Parth Soni</title>
<meta name="robots" content="noindex" />
<!--
  Why this file exists rather than being left to the platform: with no 404.html
  in the upload, Pages answers `200` with index.html for every unmatched path, so
  a path that serves nothing is indistinguishable from a page that does (measured
  on F1 before its own 404.html existed) - and until this file, an unknown path
  here got Cloudflare's generic 509-byte error page instead of the site's own.

  No inline style and no script, because the CSP in _headers is `style-src 'self'`
  and `script-src 'self'` with hashes: the sheet below is same-origin, and there is
  nothing here that needs to run.
-->
<link rel="stylesheet" href="/404.css" />
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Nothing at this address</h1>
  <p>That page has moved, or it never existed. <a href="/">Back to the portfolio</a>.</p>
</main>
</body>
</html>

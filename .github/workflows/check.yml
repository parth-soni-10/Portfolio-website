name: Check

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No build step and no dependencies: the staged directory is the whole site,
      # so "does it still parse" is what a static check can say. The two shared
      # shaping modules (dash-aggregate.js, medium-feed.js) load before script.js,
      # the Pages Functions are bundled by Pages at deploy time (not here, so a
      # parse error would otherwise only surface in production), and each snapshot
      # tool runs its module under Node. package.json holds the test script;
      # functions/package.json marks the Functions as ES modules for Node without
      # changing the module type of those browser scripts. The tools are the only
      # files here that need the network, and CI does not reach for it (see
      # CLAUDE.md on refreshing a snapshot).
      - name: Syntax-check the scripts
        run: |
          node --check dash-aggregate.js
          node --check medium-feed.js
          node --check motion-init.js
          node --check script.js
          node --check functions/api/medium.js
          node --check functions/api/contributions.js
          node --check functions/_middleware.js
          node --check functions/_agent-docs.js
          node --check tools/snapshot-dashboard-fallback.mjs
          node --check tools/snapshot-medium-fallback.mjs
          node --check tools/build-projects.mjs

      # The Content-Security-Policy exists twice on purpose: a <meta> tag cannot
      # carry frame-ancestors, so _headers holds the full set and index.html
      # holds everything except that one directive. Two copies drift, and a
      # drifted copy means the browser enforces the intersection of both and the
      # site breaks in ways that are hard to read — so the drift is checked.
      - name: Check the two CSP copies are still in step
        run: node tools/check-headers.mjs

      # projects/<slug>/index.html is generated from the #projects panels in
      # index.html, so a panel edit without a rebuild leaves a page that quietly
      # disagrees with the home page. This re-derives every page, compares it
      # with what is committed, and checks the canonical URL, the copied CSP and
      # the sitemap entry each one needs.
      - name: Check the project pages match their panels
        run: node tools/build-projects.mjs --check

      # The agent surfaces are behaviour, not copy: Accept negotiation, the 404
      # and 406 bodies, the aliases, Vary/Link, the Organization node, llms.txt
      # and the privacy page. The tests import the same middleware Pages runs.
      - name: Test the agent surfaces
        run: node --test tests/*.test.mjs

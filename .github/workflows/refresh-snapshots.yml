name: Refresh snapshots

on:
  schedule:
    - cron: '0 6 * * 0' # Weekly on Sunday at 06:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run snapshot refresh
        run: node tools/refresh-snapshots.mjs
